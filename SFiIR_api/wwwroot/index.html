<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация АСУ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        /* === Базовые стили === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            line-height: 1.5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #1a365d;
            font-size: 1.8rem;
        }

        /* === Вкладки === */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .tab-btn:hover { background: #e2e8f0; color: #334155; }
        .tab-btn.active {
            background: #fff;
            color: #1e40af;
            border-bottom: 2px solid #1e40af;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* === Панели управления === */
        .controls {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .controls h3 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: #334155;
        }
        .param-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 140px;
            flex: 1;
        }
        .form-group label {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .primary-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .primary-btn:hover { background: #2563eb; }
        .primary-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* === Статистика === */
        .count-info, .stats-panel {
            display: flex;
            gap: 16px;
            padding: 10px 0;
            color: #64748b;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .stats-panel {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .stats-panel strong { color: #1e293b; }

        /* === Графики и таблицы === */
        .chart-wrapper {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            min-height: 200px;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            display: block;
        }
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        thead {
            background: #f8fafc;
            position: sticky;
            top: 0;
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { font-weight: 600; color: #334155; }
        tbody tr:hover { background: #f8fafc; }

        /* === Адаптив === */
        @media (max-width: 768px) {
            .param-row { flex-direction: column; }
            .form-group { min-width: 100%; }
            .tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1; min-width: 120px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Визуализация АСУ</h1>
    
    <!-- Переключатель вкладок -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="requests">Заявки</button>
        <button class="tab-btn" data-tab="processes">Процессы</button>
    </div>

    <!-- Вкладка: Заявки -->
    <div id="tab-requests" class="tab-content active">
        <div class="controls">
            <h3>Параметры для заявок</h3>
            <div class="param-row">
                <div class="form-group">
                    <label for="req-arrivalLambda">λ Прибытия</label>
                    <input type="number" id="req-arrivalLambda" value="0.1" step="0.1" min="0.01">
                </div>
                <div class="form-group">
                    <label for="req-memLambda">λ Памяти</label>
                    <input type="number" id="req-memLambda" value="128" step="1" min="1">
                </div>
                <div class="form-group">
                    <label for="req-cpuLambda">λ CPU</label>
                    <input type="number" id="req-cpuLambda" value="50" min="1">
                </div>
                <div class="form-group">
                    <label for="req-testTime">Время теста (T)</label>
                    <input type="number" id="req-testTime" value="500" min="10">
                </div>
                <div class="form-group">
                    <label for="req-rngSeed">RNG Seed</label>
                    <input type="number" id="req-rngSeed" value="42" min="0">
                </div>
            </div>
            <button id="buildRequestsBtn" class="primary-btn" style="margin-top:12px">Построить заявки</button>
        </div>
        
        <div class="count-info" id="requestsCountInfo"></div>
        
        <div class="chart-wrapper">
            <canvas id="requestsChart"></canvas>
        </div>
        
        <div class="table-wrapper">
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Прибытие</th>
                        <th>Память</th>
                        <th>CPU</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Вкладка: Процессы -->
    <div id="tab-processes" class="tab-content">
        <div class="controls process-params">
            <h3>Параметры для процессов</h3>
            <div class="param-row">
                <div class="form-group">
                    <label for="proc-arrivalLambda">λ Прибытия</label>
                    <input type="number" id="proc-arrivalLambda" value="0.1" step="0.1" min="0.01">
                </div>
                <div class="form-group">
                    <label for="proc-memLambda">λ Памяти</label>
                    <input type="number" id="proc-memLambda" value="128" step="1" min="1">
                </div>
                <div class="form-group">
                    <label for="proc-cpuLambda">λ CPU</label>
                    <input type="number" id="proc-cpuLambda" value="50" min="1">
                </div>
                <div class="form-group">
                    <label for="proc-testTime">Время теста (T)</label>
                    <input type="number" id="proc-testTime" value="500" min="10">
                </div>
                <div class="form-group">
                    <label for="proc-rngSeed">RNG Seed</label>
                    <input type="number" id="proc-rngSeed" value="42" min="0">
                </div>
                <div class="form-group">
                    <label for="proc-arrivalTime">Время прибытия</label>
                    <input type="number" id="proc-arrivalTime" value="100" min="0">
                </div>
                <div class="form-group">
                    <label for="proc-maxMem">Макс. память</label>
                    <input type="number" id="proc-maxMem" value="1024" min="1">
                </div>
                <div class="form-group">
                    <label for="proc-cpuQuant">Квант CPU</label>
                    <input type="number" id="proc-cpuQuant" value="10" min="1">
                </div>
            </div>
            <button id="buildProcessesBtn" class="primary-btn" style="margin-top:12px">Построить процессы</button>
        </div>
        
        <div class="stats-panel">
            <span>Записей в логе: <strong id="logCount">—</strong></span>
            <span>Процессы: <strong id="processCount">—</strong></span>
            <span>Интервалов: <strong id="intervalCount">—</strong></span>
        </div>
        
        <div class="chart-wrapper">
            <canvas id="processesChart"></canvas>
        </div>
        
        <div class="table-wrapper">
            <table id="processesTable">
                <thead>
                    <tr>
                        <th>Process ID</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Скрипты -->
<script src="tabs.js"></script>
<script src="requests.js"></script>
<script src="processes.js"></script>

</body>
</html>
